[phases.setup]
# Node 22.23.4: security release of October 21 2026 (CVE-2026-111497, Brotli RCE).
# Nixpacks only selects the Node major, the exact version comes from this nixpkgs
# commit ("nodejs_22: 22.23.3 -> 22.23.4" on master).
nixpkgsArchive = 'fb7f563bfe8c946201d132e50c9b0f526f983890'
# no '...': the provider would add its own Node, picked from engines.node
nixPkgs = ['nodejs_22', 'openssl']
