[phases.setup]
# no '...': the provider would add its own Node, picked from engines.node
nixPkgs = ['openssl', 'curl', 'xz']
# Same version in Dockerfile.cron, Dockerfile.prisma and .node-version.
# Node 22.23.5: security release of November 11 2026 (http2 and tls fixes, CVE-2026-123863 and others).
# Installed from the official nodejs.org build: nixpkgs only has it on master, not
# in the binary cache, so Nix compiled Node from source on every build.
# Checksums from https://nodejs.org/dist/v22.23.5/SHASUMS256.txt
# /usr/local/bin is not in the PATH of the Nixpacks image, paths adds /opt/node/bin to it
paths = ['/opt/node/bin']
cmds = [
  'case "$(uname -m)" in x86_64) arch=x64 sha=cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8 ;; aarch64) arch=arm64 sha=2babb9eb5264860d540849f4b064a6fbdebcdc323657d9d382ce23d313fd5e09 ;; *) echo "unsupported architecture $(uname -m)" && exit 1 ;; esac && curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-$arch.tar.xz" && echo "$sha  /tmp/node.tar.xz" | sha256sum -c - && mkdir -p /opt/node && tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1 --no-same-owner && rm /tmp/node.tar.xz',
  # pnpm at the packageManager version (pnpm@10.15.0)
  'corepack enable',
  'node -v',
]

[variables]
COREPACK_ENABLE_DOWNLOAD_PROMPT = '0'

[phases.install]
# without the provider's `npm install -g corepack@0.24.1`, which would replace the
# corepack bundled with Node 22.23.5 by one too old for the current npm signing keys
cmds = ['pnpm i --frozen-lockfile']
