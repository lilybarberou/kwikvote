[phases.setup]
# no '...': the provider would add its own Node, picked from engines.node
nixPkgs = ['openssl', 'curl', 'xz']
# Node 22.23.4: security release of October 21 2026 (CVE-2026-111497, Brotli RCE).
# Installed from the official nodejs.org build: nixpkgs only has it on master, not
# in the binary cache, so Nix compiled Node from source on every build.
# Checksums from https://nodejs.org/dist/v22.23.4/SHASUMS256.txt
# /usr/local/bin is not in the PATH of the Nixpacks image, paths adds /opt/node/bin to it
paths = ['/opt/node/bin']
cmds = [
  'case "$(uname -m)" in x86_64) arch=x64 sha=1805bcd35e6815559bd2eb97db438d3fdb0eb3a5e6a977b7c1badca76337e9ce ;; aarch64) arch=arm64 sha=6287aa46b6c375d816e63ae66d024fbbfd70404825aabdfdf898a970871d2f4b ;; *) echo "unsupported architecture $(uname -m)" && exit 1 ;; esac && curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v22.23.4/node-v22.23.4-linux-$arch.tar.xz" && echo "$sha  /tmp/node.tar.xz" | sha256sum -c - && mkdir -p /opt/node && tar -xJf /tmp/node.tar.xz -C /opt/node --strip-components=1 --no-same-owner && rm /tmp/node.tar.xz',
  # pnpm at the packageManager version (pnpm@10.15.0)
  'corepack enable',
  'node -v',
]

[variables]
COREPACK_ENABLE_DOWNLOAD_PROMPT = '0'

[phases.install]
# without the provider's `npm install -g corepack@0.24.1`, which would replace the
# corepack bundled with Node 22.23.4 by one too old for the current npm signing keys
cmds = ['pnpm i --frozen-lockfile']
